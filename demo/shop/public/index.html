<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fieldnote Goods</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Fieldnote Goods</a>
    <nav>
      <a href="#/" data-nav="shop">Shop</a>
      <a href="#/orders" data-nav="orders">My orders</a>
      <a href="#/cart" data-nav="cart" class="cart-link">Cart <span id="cart-count" class="badge" aria-label="items in cart">0</span></a>
    </nav>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <div class="actions">
        <button id="modal-cancel" class="secondary">Keep order</button>
        <button id="modal-ok" class="danger">Yes, cancel order</button>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
